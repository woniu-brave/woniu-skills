<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>规格与选型｜详情页模板</title>
  <link rel="stylesheet" href="visual.css">
</head>
<body>
<main class="spec">
  <!-- 示例图和文案用于展示版式。实际使用时换成当前商品图片和有依据的内容。 -->
  <section class="hero" data-export-id="hero">
    <header class="copy"><p class="label">桌面分格收纳</p><h1>两格，或三格</h1><p class="lead">按桌面余量和常用物品的分类选择。</p></header>
    <img class="photo tall" src="../assets/spec-a.svg" alt="两种收纳盒并排展示">
  </section>
  <section class="comparison" data-export-id="comparison">
    <header class="copy"><h2>并排对照</h2><p class="lead">从分格和适合的位置看差别。</p></header>
    <div class="pair "><figure><img class="photo " src="../assets/spec-b.svg" alt="两格收纳盒"><figcaption>两格款</figcaption></figure><figure><img class="photo " src="../assets/spec-c.svg" alt="三格收纳盒"><figcaption>三格款</figcaption></figure></div>
    <table class="matrix"><thead><tr><th scope="col">比较项</th><th scope="col">两格款</th><th scope="col">三格款</th></tr></thead><tbody><tr><th scope="row">分格</th><td>两格</td><td>三格</td></tr><tr><th scope="row">摆放位置</th><td>窄桌边</td><td>宽桌面</td></tr></tbody></table>
  </section>
  <section class="measure dark" data-export-id="measure">
    <header class="copy"><h2>先量可用空间</h2><p class="lead">用最窄的一段作为选尺寸的依据。</p></header>
    <img class="photo wide" src="../assets/spec-d.svg" alt="俯视两款盒子的分格">
    <div class="strip"><p><strong>盒体外宽</strong><br>对应桌面横向空间</p><p><strong>盒体深度</strong><br>给桌沿留出余量</p></div>
  </section>
  <section class="placement muted" data-export-id="placement">
    <header class="copy"><h2>常拿的放手边</h2></header>
    <img class="photo wide round" src="../assets/spec-d.svg" alt="收纳盒内放铅笔与小文具">
    <div class="pair "><div class="insert"><h3>两格</h3><p>把手边物品分成两类。</p></div><div class="insert"><h3>三格</h3><p>腾出一格单放零碎小物。</p></div></div>
  </section>
  <section class="included accent" data-export-id="included">
    <header class="copy"><h2>到手是所选盒体</h2><p class="lead">用组合图对照款式，再按实售选项下单。</p></header>
    <img class="photo tall" src="../assets/spec-a.svg" alt="两款盒体的组合展示">
    <p class="rule">图中书写用品仅用于演示收纳。</p>
  </section>
</main>
</body>
</html>
