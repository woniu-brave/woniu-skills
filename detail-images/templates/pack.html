<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>包装与使用｜详情页模板</title>
  <link rel="stylesheet" href="visual.css">
</head>
<body>
<main class="pack">
  <!-- 示例图和文案用于展示版式。实际使用时换成当前商品图片和有依据的内容。 -->
  <section class="hero" data-export-id="hero">
    <header class="copy"><h1>午后花草饮</h1><p class="lead">看得见的外盒、独立袋和杯中茶汤。</p></header>
    <img class="photo tall" src="../assets/pack-a.svg" alt="暖橙色外盒和一杯花草饮">
    <p class="rule">外盒装 · 独立冲泡袋</p>
  </section>
  <section class="contents muted" data-export-id="contents">
    <header class="copy"><h2>打开外盒看一看</h2></header>
    <img class="photo tall" src="../assets/pack-b.svg" alt="打开的外盒与取出的独立冲泡袋">
    <div class="strip"><p><strong>纸质外盒</strong><br>方便集中收纳</p><p><strong>独立冲泡袋</strong><br>取用时单独打开</p></div>
  </section>
  <section class="infusion dark" data-export-id="infusion">
    <header class="copy"><p class="label">冲泡示意</p><h2>杯中慢慢展开</h2></header>
    <img class="photo wide edge" src="../assets/pack-c.svg" alt="杯中冲泡袋与茶汤的近景">
    <p class="lead">放入冲泡袋、加水，静置后饮用。水量与时间以外盒标注为准。</p>
  </section>
  <section class="storage" data-export-id="storage">
    <header class="copy"><h2>从外盒读取信息</h2><p class="lead">收到商品后，对照包装上的说明。</p></header>
    <img class="photo wide round" src="../assets/pack-a.svg" alt="花草饮外盒示意">
    <dl class="facts"><dt>冲泡方法</dt><dd>核对每袋水量和时间</dd><dt>贮存方式</dt><dd>按外盒标注存放</dd><dt>配料信息</dt><dd>以实际商品标签为准</dd></dl>
  </section>
  <section class="serving cover dark" data-export-id="serving">
    <img class="photo full" src="../assets/pack-d.svg" alt="午后餐桌上的花草饮和外盒">
    <div class="veil"></div>
    <header class="copy"><h2>午后泡一杯</h2><p class="lead">热水落下，留一小段空闲。</p></header>
  </section>
</main>
</body>
</html>
