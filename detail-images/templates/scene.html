<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>场景与搭配｜详情页模板</title>
  <link rel="stylesheet" href="visual.css">
</head>
<body>
<main class="scene">
  <!-- 示例图和文案用于展示版式。实际使用时换成当前商品图片和有依据的内容。 -->
  <section class="hero cover dark" data-export-id="hero">
    <img class="photo full" src="../assets/scene-a.svg" alt="午后窗光下的橄榄绿休闲椅">
    <div class="veil"></div>
    <header class="copy"><p class="label">家里的阅读角</p><h1>山影休闲椅</h1><p class="lead">带一点绿，也带一点午后的光。</p></header>
  </section>
  <section class="placement muted" data-export-id="placement">
    <header class="copy"><h2>把椅子留给窗边</h2><p class="lead">一个小角落，也能有自己的用途。</p></header>
    <img class="photo tall" src="../assets/scene-b.svg" alt="椅子的正侧面">
    <p class="rule">从扶手最宽处开始量，给起身和走动留出余量。</p>
  </section>
  <section class="pairing" data-export-id="pairing">
    <header class="copy"><h2>两种光线下的绿</h2><p class="lead">窗光和暖灯会让橄榄绿看起来不同。</p></header>
    <div class="pair "><figure><img class="photo " src="../assets/scene-a.svg" alt="阅读椅在自然窗光下"><figcaption>窗边</figcaption></figure><figure><img class="photo " src="../assets/scene-d.svg" alt="阅读椅在室内暖灯下"><figcaption>暖灯下</figcaption></figure></div>
    <div class="band"><strong>摆位时顺手试坐</strong><p>确认伸手能拿到书，也能轻松起身。</p></div>
  </section>
  <section class="material dark" data-export-id="material">
    <header class="copy"><p class="label">局部材质</p><h2>布纹与木扶手</h2></header>
    <img class="photo wide edge" src="../assets/scene-c.svg" alt="椅面滚边和木扶手近景">
    <div class="strip"><p><strong>椅面</strong><br>看布纹和滚边</p><p><strong>扶手</strong><br>看弧度和搭接</p></div>
  </section>
  <section class="fit accent" data-export-id="fit">
    <header class="copy"><h2>布置阅读角</h2><p class="lead">先选灯的位置，再安排常用物品。</p></header>
    <img class="photo tall round" src="../assets/scene-d.svg" alt="休闲椅、落地灯和书组成的阅读角">
    <p class="rule">椅子是本页展示商品。灯与书为陈列道具。</p>
  </section>
</main>
</body>
</html>
