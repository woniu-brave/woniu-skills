<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>外观与工艺｜详情页模板</title>
  <link rel="stylesheet" href="visual.css">
</head>
<body>
<main class="craft">
  <!-- 示例图和文案用于展示版式。实际使用时换成当前商品图片和有依据的内容。 -->
  <section class="hero" data-export-id="hero">
    <header class="copy"><h1>雾玫瑰<br>绒织开衫</h1></header>
    <img class="photo tall arch top" src="../assets/craft-a.svg" alt="暖光下穿雾玫瑰开衫的模特">
    <p class="lead">颗粒织纹与浅色圆扣，留一点复古感。</p>
  </section>
  <section class="finish muted" data-export-id="finish">
    <header class="copy"><p class="label">织纹与门襟</p><h2>近看那一针一线</h2></header>
    <img class="photo tall round" src="../assets/craft-c.svg" alt="织物肌理和浅色扣子">
    <div class="strip"><p><strong>颗粒肌理</strong><br>织纹微微起伏</p><p><strong>浅色扣面</strong><br>沿着门襟排布</p></div>
  </section>
  <section class="silhouette" data-export-id="silhouette">
    <header class="copy"><h2>平铺与上身</h2><p class="lead">同时看衣身轮廓、肩线和袖型。</p></header>
    <div class="pair offset"><figure><img class="photo portrait top" src="../assets/craft-b.svg" alt="开衫平铺"><figcaption>平铺 · 衣身</figcaption></figure><figure><img class="photo portrait top" src="../assets/craft-d.svg" alt="开衫上身侧后角度"><figcaption>上身 · 袖型</figcaption></figure></div>
    <p class="rule">微拱的袖型在袖口收拢。</p>
  </section>
  <section class="details dark" data-export-id="details">
    <header class="copy"><p class="label">搭配</p><h2>一抹雾玫瑰</h2></header>
    <img class="photo tall top" src="../assets/craft-d.svg" alt="雾玫瑰开衫上身侧后角度">
    <p class="lead">搭配浅色下装，让粉调留在上半身。</p>
  </section>
  <section class="specifications muted" data-export-id="specifications">
    <header class="copy"><h2>款式一览</h2><p class="lead">从颜色到穿着细节。</p></header>
    <img class="photo wide" src="../assets/craft-b.svg" alt="开衫平铺正面">
    <dl class="facts"><dt>颜色</dt><dd>雾玫瑰</dd><dt>开合</dt><dd>前襟圆扣</dd><dt>领型</dt><dd>圆领</dd></dl>
  </section>
</main>
</body>
</html>
